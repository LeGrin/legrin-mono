services:
  finance-pipeline:
    build: .
    container_name: legrin-finance-pipeline
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./secrets:/run/secrets:ro
    networks:
      - legrin_default
    ports:
      - "127.0.0.1:${FINANCE_PORT:-18088}:8088"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8088/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  legrin_default:
    external: true
