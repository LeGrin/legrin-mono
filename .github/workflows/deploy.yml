name: Finance CI/CD

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legrin-finance-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm run check

      - name: Build production image
        run: docker build --tag legrin-finance-pipeline:ci .

  deploy:
    name: Deploy to legrin-main
    needs: verify
    runs-on: [self-hosted, linux, ARM64, legrin-main, legrin-mono]
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out verified revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Deploy tracked source through the restricted root wrapper
        run: git archive --format=tar.gz HEAD | sudo /usr/local/sbin/deploy-legrin-finance "$GITHUB_SHA"

      - name: Verify local production health
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 2 \
            http://127.0.0.1:18088/health

